name: "iKuuu 每日签到"
description: "ikuuu（org/top/pw 三域名通用）：自动抓取 Cookie、每日定时签到并通知剩余流量，Cookie 快到期时提醒重新登录"
author: "Yjwj205 / Minis"
homepage: "https://github.com/jadkg/egern"
icon: "calendar.badge.checkmark"

# 在模块设置页可改：签到时间（5 段 cron：分 时 日 月 周）
compat_arguments:
  CHECKIN_CRON: "0 8 * * *"

env_schema:
  COOKIE:
    name: "手动 Cookie"
    description: "可选。留空则使用自动抓取的 Cookie；填了会优先使用"
  REQUEST_POLICY:
    name: "请求策略"
    description: "可选：节点名 / 策略组名 / DIRECT，留空跟随规则"
  NOTIFY:
    name: "通知"
    options:
      - "true"
      - "false"
  EXPIRE_INFO:
    name: "显示 CK 剩余天数"
    options:
      - "true"
      - "false"
  PARALLEL:
    name: "并行读流量"
    description: "签到和读流量同时请求；剩余流量可能是签到前的值"
    options:
      - "true"
      - "false"
  INSECURE_TLS:
    name: "跳过证书校验"
    description: "仅在出现 TLS/证书错误时开启排查，默认关闭"
    options:
      - "true"
      - "false"

scriptings:
  - http_request:
      name: "iKuuu Cookie 抓取"
      match: "^https?://(?:www\\.)?ikuuu\\.(?:org|top|pw)/"
      script_url: "https://raw.githubusercontent.com/jadkg/egern/refs/heads/main/ikuuu-cookie.js"
      timeout: 10

  - schedule:
      name: "iKuuu 定时签到"
      cron: "{{{CHECKIN_CRON}}}"
      script_url: "https://raw.githubusercontent.com/jadkg/egern/refs/heads/main/ikuuu-checkin.js"
      timeout: 60

mitm:
  hostnames:
    - "ikuuu.org"
    - "*.ikuuu.org"
    - "ikuuu.top"
    - "*.ikuuu.top"
    - "ikuuu.pw"
    - "*.ikuuu.pw"
